[project]
name = "kappa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "lerobot==0.3.3",
    "matplotlib>=3.10.8",
    "onnxruntime>=1.18.0",
    "polars>=1.40.1",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.2",
    "qwen-vl-utils>=0.0.14",
    "scipy>=1.14.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers>=5.5.4",
    "tyro>=1.0.13",
    "deepspeed>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
