[project]
name = "kappa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "lerobot==0.3.3",
    "matplotlib>=3.10.8",
    "polars>=1.40.1",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.2",
    "qwen-vl-utils>=0.0.14",
    "scipy>=1.14.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers>=5.5.4",
    "tyro>=1.0.13",
    "deepspeed>=0.16.0",
    "onnxruntime-gpu>=1.25.0",
    "mujoco>=3.7.0",
    "decord>=0.6.0",
    "gpustat>=1.1.1",
    "mediapy>=1.2.6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pyzmq>=26.0",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "opencv-python>=4.10.0",
    "gear_sonic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
gear_sonic = { path = "GR00T-WholeBodyControl/gear_sonic", editable = true }

[tool.uv]
override-dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.14",
]
